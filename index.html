<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TSLV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TSLV">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F0F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1013" media="(prefers-color-scheme: dark)">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 片手操作のモバイル優先。上に共通のプロジェクトボタンと大きなタブ名、下に入力欄とタブバーを固定。箱ごとに色を変えて今どこに書いているか一目で分かるように */
:root{
  --bg:#F0F1EC; --surface:#FFFFFF; --surface-2:#E6E8E1; --ink:#14161B; --muted:#686C74; --line:#D8DAD2;
  --task:#2F43E8; --log:#B86E05; --stock:#0A8574; --vision:#8239CC;
  --danger:#CF3326; --ok:#1F8A4C;
  --accent:var(--task);
  --f-display:"Bricolage Grotesque","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1013; --surface:#191B20; --surface-2:#22252B; --ink:#ECEDE8; --muted:#8F939C; --line:#2B2E35;
  --task:#8291FF; --log:#F0A43A; --stock:#3FC8B3; --vision:#BC8DF2; --danger:#FF6E61; --ok:#4FCB84; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1013; --surface:#191B20; --surface-2:#22252B; --ink:#ECEDE8; --muted:#8F939C; --line:#2B2E35;
  --task:#8291FF; --log:#F0A43A; --stock:#3FC8B3; --vision:#BC8DF2; --danger:#FF6E61; --ok:#4FCB84; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body[data-box="task"]{--accent:var(--task)} body[data-box="log"]{--accent:var(--log)}
body[data-box="stock"]{--accent:var(--stock)} body[data-box="vision"]{--accent:var(--vision)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 200px}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.date{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.pjbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700}
.pjbtn .n{font-family:var(--f-mono);font-weight:500;font-size:12px;opacity:.75}
.pjbtn[aria-pressed="true"]{background:var(--accent);color:#fff}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px}
.title{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em;margin:0;color:var(--accent);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.title small{font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:0;color:var(--muted)}
.headbtns{display:flex;gap:6px;flex:none}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.iconbtn svg{width:18px;height:18px}
.iconbtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:6px}
.sync.warn{color:var(--danger)}

/* views */
.views{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:16px}
.view{padding:8px 2px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;min-width:0;overflow:hidden;font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
@media (max-width:440px){.view[data-view="pj"] .n{display:none}}
.view .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.view[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.view[aria-pressed="true"] .n{color:var(--bg);opacity:.7}
.view .alert{width:7px;height:7px;border-radius:50%;background:var(--danger)}

.genres{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{padding:4px 10px;border-radius:6px;font-size:12px;color:var(--muted);background:var(--surface-2)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-weight:700}
.chip.add{border:1px dashed var(--line);background:none}

.search{margin-top:12px;width:100%;padding:9px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}

/* list */
.section{margin-top:22px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.sh h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.sh span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);position:relative}
.row.t{padding-block:8px}
.row:first-child{border-top:0}
.row.overdue{box-shadow:inset 3px 0 0 var(--danger)}
.check{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s}
.check svg{width:12px;height:12px;opacity:0;color:var(--bg)}
.check:hover{border-color:var(--accent)}
.row.done .check{background:var(--ok);border-color:var(--ok)} .row.done .check svg{opacity:1}
.row.done .txt{color:var(--muted);text-decoration:line-through}
.dot{flex:none;width:8px;height:8px;border-radius:2px;background:var(--accent);align-self:flex-start;margin-top:8px}
.body{flex:1;min-width:0;cursor:pointer}
.txt{word-break:break-word;white-space:pre-wrap}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px;font-size:12px;color:var(--muted)}
.meta .bad{color:var(--danger);font-weight:700}
.meta .person{color:var(--ink);font-weight:500}
.meta a{color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface-2)}
.tag.wait{background:color-mix(in srgb,var(--log) 18%,transparent);color:var(--log);font-weight:700}
.tag.hold{background:var(--surface-2);color:var(--muted)}
.due{flex:none;min-width:52px;padding:5px 10px;white-space:nowrap;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);color:var(--muted);background:var(--bg);font-variant-numeric:tabular-nums}
.due.on{background:var(--accent);border-color:var(--accent);color:#fff}
.due.late{background:var(--danger);border-color:var(--danger);color:#fff}
.due.date{color:var(--ink)}
.due.wait{background:var(--log);border-color:var(--log);color:#fff}
.btns{flex:none;display:flex;gap:4px}
@media (max-width:380px){.btns{flex-direction:column}}
.mini{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.mini svg{width:17px;height:17px}
.mini[aria-pressed="true"]{color:var(--accent)}
.mini:hover{background:var(--surface-2)}
.order{display:flex;flex-direction:column;flex:none}
.order .mini{width:26px;height:18px}

/* 連携タスク group row */
.grp{cursor:pointer}
.grp{padding-block:16px;flex-wrap:wrap;row-gap:10px;background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.grp .gt{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .gn{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.grp .chev{flex:none;color:var(--muted)}
.grp .chev svg{width:18px;height:18px;display:block}

.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.08em}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .s{font-size:11px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:4px;height:44px;margin-top:10px}
.bars i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.bars i.zero{opacity:.18}
.barlab{display:flex;gap:4px;font-family:var(--f-mono);font-size:9px;color:var(--muted)}
.barlab span{flex:1;text-align:center}

/* projects */
.pj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%}
.pj+.pj{margin-top:8px}
.pj .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pj .name{font-weight:700;font-size:15px;min-width:0}
.pj .pct{flex:none;font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.pj .pct small{font-size:11px;font-weight:500;color:var(--muted);margin-left:2px}
.pj .na{display:flex;align-items:baseline;gap:8px;font-size:13px;min-width:0}
.pj .na b{flex:none;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.pj .na span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj .na.none span{color:var(--muted)}
.pjhead{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.pjhead h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pjhead h2 small,.pj .name small{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.prog.thick{height:8px;border-radius:4px}
.grp .gpw{flex-basis:100%;display:flex;align-items:center;gap:10px}
.grp .gpw .prog{flex:1}
.grp .gpw span{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.picklist{max-height:50vh;overflow-y:auto}
.pj .kind{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:4px;margin-right:8px;vertical-align:2px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.pj .top .mini{width:26px;height:26px;font-size:12px;margin-left:4px}
.kindseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kindseg button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700;color:var(--muted)}
.kindseg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sheetacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sheetacts .btn{padding:11px 6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:480px){.sheetacts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn.danger.armed{background:var(--danger);color:#fff}
.actions .btn.danger.armed{background:var(--danger);color:#fff}
.pjhead .pm{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.prog{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.pj .pm{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.pj .pm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.back{font-size:13px;color:var(--muted);display:inline-flex;gap:4px;align-items:center;margin-top:16px}

/* composer + tabbar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:720px;margin:0 auto}
.composer{display:flex;flex-direction:column;gap:6px;padding:10px 0 6px}
.c1,.c2{display:flex;gap:6px}
.c1{align-items:flex-end}
.c1 textarea,.c2 input{flex:1;min-width:0;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.c1 textarea{border:1.5px solid var(--accent);resize:none;line-height:1.45;max-height:40vh;overflow-y:auto;display:block}
.c1 button{flex:none;width:48px;height:46px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center}
.c1 button svg{width:20px;height:20px}
.c2 input{padding:8px 12px;font-size:15px}
.toggle2{flex:none;display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.toggle2 button{padding:0 16px;font-size:14px;font-weight:700;color:var(--muted)}
.toggle2 button[aria-pressed="true"]{background:var(--accent);color:#fff}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:2px 0 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:10px;color:var(--muted)}
.tab b{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1}
.tab span{font-size:10px;letter-spacing:.04em}
.tab[data-b="task"]{--c:var(--task)} .tab[data-b="log"]{--c:var(--log)} .tab[data-b="stock"]{--c:var(--stock)} .tab[data-b="vision"]{--c:var(--vision)}
.tab[aria-selected="true"]{color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .38);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;overflow-y:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgb(0 0 0 / .18)}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-family:var(--f-display);font-size:22px;letter-spacing:-.02em}
.sheet h2 em{font-style:normal;font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);display:block;letter-spacing:0}
.sheet .section{margin-top:4px}
.sheet .list{background:var(--bg)}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.field>.lab{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.field input,.field select,.field textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
.field textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg button{padding:7px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg input[type="date"]{width:auto;flex:1;min-width:140px;padding:6px 10px}
.seg.boxes button[data-b="task"][aria-pressed="true"]{background:var(--task);border-color:var(--task)}
.seg.boxes button[data-b="log"][aria-pressed="true"]{background:var(--log);border-color:var(--log)}
.seg.boxes button[data-b="stock"][aria-pressed="true"]{background:var(--stock);border-color:var(--stock)}
.seg.boxes button[data-b="vision"][aria-pressed="true"]{background:var(--vision);border-color:var(--vision)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.sw input{width:20px;height:20px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:11px 16px;border-radius:10px;font-weight:700;background:var(--accent);color:#fff}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.grow{flex:1}
.gl{display:flex;flex-direction:column;gap:6px}
.gl .gi{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:8px;border:1px solid var(--line)}
.gl .gi{flex-wrap:wrap;touch-action:pan-y}
.gl .gi.dragging{box-shadow:0 8px 24px rgb(0 0 0 / .18);border-color:var(--accent);position:relative;z-index:2;background:var(--surface)}
.gl .handle{flex:none;width:28px;height:30px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none}
.gl .handle svg{width:16px;height:16px}
.gl .gdesc-in{flex-basis:100%;margin-left:36px;border:0;border-top:1px dashed var(--line);background:transparent;padding:6px 0 2px;font-size:12px;color:var(--muted)}
.gl .gdesc-in:focus{outline:none;color:var(--ink);border-top-color:var(--accent)}
.gdesc{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.vnote{white-space:pre-wrap;word-break:break-word;font-size:15px;line-height:1.75;padding:14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);min-height:80px}
.vnote.empty{color:var(--muted);font-size:13px}
.gl .gi .gname{flex:1;text-align:left;min-width:0;border:0;border-bottom:1px dashed transparent;background:transparent;padding:4px 0;font-size:15px}
.gl .gi .gname:focus{outline:none;border-bottom-color:var(--accent)}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.inlineform{display:flex;gap:6px}
.inlineform input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.inlineform .btn{padding:10px 14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(190px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgb(0 0 0 / .2);max-width:calc(100% - 32px)}
.toast button{color:var(--bg);font-weight:700;text-decoration:underline}

@media (min-width:720px){.title{font-size:56px}}

  return {genres:g, projects:Array.isArray(m?.projects)?m.projects.map(p=>({...p})):[], taskDefault:td, genreNotes:notes, titleSort:ts, seeds:Array.isArray(m?.seeds)?[...m.seeds]:[], folderModes:{...(m?.folderModes||{})}, multi:Array.isArray(m?.multi)?m.multi.map(e=>({...e})):[]};
}
function lsSave(){ if(S.mode!=="local") return; try{ localStorage.setItem(LS_KEY, JSON.stringify({items:[...S.items.values()], meta:S.meta})); }catch(e){} }
function lsLoad(){ try{ const o = JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(!o) return; if(o.meta) S.meta = normMeta(o.meta); (o.items||[]).forEach(i=>S.items.set(i.id,normItem(i))); }catch(e){} }
function queueWrite(id, fn){
  const next = (writeChains.get(id) || Promise.resolve()).then(fn).catch(e => setSync(e?.code==="quota_exceeded" ? "保存できる件数の上限に達しました。古い完了項目を削除してください" : "保存に失敗しました。通信状況を確認してください", true));
  writeChains.set(id, next); return next;
}
function persistItem(item){ S.items.set(item.id, item); if(S.mode==="db") queueWrite(item.id, () => col.doc(item.id).set(item)); else lsSave(); }
function removeItem(id){ S.items.delete(id); if(S.mode==="db") queueWrite(id, () => col.doc(id).delete()); else lsSave(); }
function persistMeta(){ if(S.mode==="db"){ const m = structuredClone(S.meta); queueWrite("meta", () => col.doc("meta").set(m)); } else lsSave(); }
function setSync(t, warn){ const el = $("#sync"); el.textContent = t; el.classList.toggle("warn", !!warn); }

// 旧「マルチタスク」の束をプロジェクトモードのフォルダへ移す（一度だけ）
function migrateMulti(){
  if(S.meta.seeds.includes("multi-v1")) return;
  const M = S.meta.multi;
  S.meta.projects.forEach(p => {
    const name = p.name;
    ofBox("task").filter(i=>i.projectId===p.id).forEach(i => {
      const note = i.person && i.person!==name ? ((i.note ? i.note+"\n" : "") + `元のフォルダ：${i.person}`) : i.note;
      persistItem({...i, projectId:"", person:name, note, updatedAt:Date.now()});
    });
    S.meta.folderModes[name] = "project";
    if(!p.archived && !M.some(e=>e.kind==="folder" && e.name===name)) M.push({kind:"folder", name});
  });
  S.meta.projects = [];
  S.meta.seeds.push("multi-v1"); persistMeta();
}
// ---------- Firebase（ログインとデータ同期） ----------
let fbAuth = null, fbDb = null, unsubData = null;
S.loaded = false;
async function initStore(){
  render();
  if(window.__TSLV_LOCAL){ S.mode = "local"; lsLoad(); S.loaded = true; setSync("テスト用（この端末のみ）", true); render(); return; }
  const app = initializeApp(FIREBASE_CONFIG);
  fbAuth = getAuth(app);
  try{ fbDb = initializeFirestore(app, {ignoreUndefinedProperties:true, localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})}); }
  catch(e){ fbDb = initializeFirestore(app, {ignoreUndefinedProperties:true}); }
  setSync("ログイン確認中…");
  onAuthStateChanged(fbAuth, user => { if(user) startData(user.uid); else showLogin(); });
}
function startData(uid){
  $("#login").hidden = true;
  const path = ["users", uid, "docs"];
  col = {
    doc: id => ({ set: d => setDoc(fsDoc(fbDb, ...path, id), d), delete: () => deleteDoc(fsDoc(fbDb, ...path, id)) }),
    setMany: async pairs => { for(let k=0; k<pairs.length; k+=400){ const bt = writeBatch(fbDb); pairs.slice(k,k+400).forEach(([id,d]) => bt.set(fsDoc(fbDb, ...path, id), d)); await bt.commit(); } }
  };
  S.mode = "db"; S.items = new Map(); S.loaded = false;
  if(unsubData) unsubData();
  unsubData = onSnapshot(collection(fbDb, ...path), {includeMetadataChanges:true}, snap => {
    const m = new Map(); let meta = null;
    snap.docs.forEach(d => { const x = d.data(); if(!x) return; if(d.id==="meta") meta = x; else m.set(d.id, normItem(x)); });
    if(meta) S.meta = normMeta(meta);
    S.items = m;
    const offline = snap.metadata.fromCache && !navigator.onLine;
    setSync(offline ? "オフライン · 電波が戻ると自動で同期します" : "同期済み", offline);
    if(!snap.metadata.fromCache){ if(!S.loaded && S.items.size) migrateMulti(); S.loaded = true; }
    render(); refreshSheet();
  }, err => setSync(err?.code==="permission-denied" ? "データを読めません。Firestoreのルール設定を確認してください" : "同期が止まりました。アプリを開き直してください", true));
}
function showLogin(){
  if(unsubData){ unsubData(); unsubData = null; }
  S.items = new Map(); S.loaded = false;
  $("#login").hidden = false; render();
  setTimeout(()=>$("#lgEmail")?.focus(), 50);
}

const followLate = i => !isDone(i) && i.wait && i.followUp && i.followUp <= today();

  if(i.box!=="task" || isDone(i)) return false;

    case "today": return isToday(i) || followLate(i);

// 今日：ジャンルで絞らない／受信箱：「すべて」なしで必ずどれか1つ／それ以外：「すべて」あり
function curGenre(){
  if(S.screen!=="main") return null;
  if(S.box==="task" && (S.view==="today" || S.view==="pj")) return null;
  if(S.box==="task" && S.view==="inbox"){ const gs = S.meta.genres.task; if(!gs.includes(S.inboxGenre)) S.inboxGenre = gs[0] || null; return S.inboxGenre; }
  if(S.box==="log" || S.box==="stock" || S.box==="vision"){
    // Log・Stockは「すべて」なし。必ずどれか1つのジャンル（ジャンルなしの項目があれば「未分類」も選べる）
    const b = S.box, gs = S.meta.genres[b], hasNone = ofBox(b).some(i=>!i.genre), g = S.noteGenre[b];
    if(gs.includes(g) || (g==="__none" && hasNone)) return g;
    return S.noteGenre[b] = gs[0] || (hasNone ? "__none" : null);
  }
  return S.genre;
}
const genreLabel = g => g==="__none" ? "未分類" : g;
function genreChips(box, source, noAll){
  const gs = S.meta.genres[box]; const cur = curGenre();
  const counts = {}; (source || (box==="task"?openTasks():ofBox(box))).forEach(i=>{ const k = i.genre||""; counts[k]=(counts[k]||0)+1; });
  return `<div class="genres">
    ${noAll ? "" : `<button class="chip" data-genre="" aria-pressed="${!cur}">すべて</button>`}
    ${gs.map(g=>`<button class="chip" data-genre="${esc(g)}" aria-pressed="${cur===g}">${esc(g)}${counts[g]?` ${counts[g]}`:""}</button>`).join("")}
    ${noAll && box!=="task" && counts[""] ? `<button class="chip" data-genre="__none" aria-pressed="${cur==="__none"}">未分類 ${counts[""]}</button>` : ""}
    <button class="chip add" data-act="genres">＋ ジャンル</button>
  </div>${cur && S.meta.genreNotes[box]?.[cur] ? `<p class="gdesc">${esc(S.meta.genreNotes[box][cur])}</p>` : ""}`;
}
const filterGenre = list => { const g = curGenre(); return !g ? list : g==="__none" ? list.filter(i=>!i.genre) : list.filter(i=>i.genre===g); };
const byDue = (a,b)=>(a.due||"9999").localeCompare(b.due||"9999") || a.order-b.order;
const collator = new Intl.Collator("ja", {numeric:true, sensitivity:"base"});
const byTitle = (a,b)=>collator.compare(a.text, b.text) || a.order-b.order;
const byName = (a,b)=>collator.compare(a, b);

// 相手のいるタスクは「連携タスク 〇〇」の1行にまとめる
// 連携タスク（相手名順）を上に固定し、その下に自分のタスクをタイトル順で並べる
function grouped(list){
  // まとめて選択中はフォルダを開いた状態（1件ずつ選べる）で並べる
  if(S.selecting) return [...list].sort((a,b)=>byName(a.person||"￿", b.person||"￿") || byTitle(a,b)).map(i=>rowTask(i)).join("");
  const groups = new Map(); const solo = [];
  for(const i of list){
    if(i.person){ if(!groups.has(i.person)) groups.set(i.person, []); groups.get(i.person).push(i); }
    else solo.push(i);
  }
  return [...groups.keys()].sort(byName).map(p=>rowGroup(p, groups.get(p))).join("")
    + [...solo].sort(byTitle).map(i=>rowTask(i)).join("");
}
const isProjFolder = p => S.meta.folderModes?.[p]==="project";
const inMulti = p => (S.meta.multi||[]).some(e=>e.kind==="folder" && e.name===p);
function folderProgress(p){ const l = ofBox("task").filter(i=>i.person===p); const d = l.filter(isDone).length; return {d, n:l.length, pct: l.length ? Math.round(d/l.length*100) : 0}; }
function rowGroup(person, list){
  const openAll = openTasks().filter(i=>i.person===person);
  const fp = isProjFolder(person) ? folderProgress(person) : null;
  const nToday = openAll.filter(isToday).length, nWait = openAll.filter(i=>i.wait).length;
  const late = openAll.some(i=>followLate(i) || (i.due && i.due < today()));
  return `<div class="row grp ${late?"overdue":""}" data-person="${esc(person)}" role="button" tabindex="0" aria-label="${esc(person)}（${list.length}件）">
    <span class="gt">${esc(person)}</span>
    <span class="gn">${list.length}</span>
    <span class="chev" aria-hidden="true">${ICON.chev}</span>
    ${fp ? `<span class="gpw"><span class="prog thick"><i style="width:${fp.pct}%"></i></span><span>${fp.d}/${fp.n} 完了</span></span>` : ""}
  </div>`;
}
function section(title, inner, right=""){
  return `<section class="section"><div class="sh"><h3>${esc(title)}</h3><span>${esc(right)}</span></div><div class="list">${inner}</div></section>`;
}
const emptyBox = (t, s) => `<div class="section empty"><b>${esc(t)}</b>${esc(s)}</div>`;

function renderTask(){
  const open = openTasks();
  const cnt = Object.fromEntries(TASK_VIEWS.map(([k])=>[k, open.filter(i=>inView(i,k)).length]));
  cnt.pj = multiEntries().length;
  const lateWait = open.some(followLate);
  let html = `<div class="views">${TASK_VIEWS.map(([k,l])=>`<button class="view" data-view="${k}" aria-pressed="${S.view===k}">${l}${k==="wait"&&lateWait?'<i class="alert" aria-label="確認日を過ぎた待ちあり"></i>':""}${cnt[k]?`<span class="n">${cnt[k]}</span>`:""}</button>`).join("")}</div>`;
  if(S.view==="inbox") html += genreChips("task", open.filter(i=>inView(i,"inbox")), true);
  else if(S.view==="wait") html += genreChips("task");
  if(S.view==="pj") return html + renderProjects();
  const list = filterGenre(open.filter(i=>inView(i,S.view)));
  if(S.view==="today"){
    const late = list.filter(i=>(i.due && i.due<today()) || (followLate(i) && !(i.due===today()))).sort(byDue);
    const now = list.filter(i=>!late.includes(i)).sort((a,b)=>a.order-b.order);
    const doneToday = filterGenre(ofBox("task").filter(i=>isDone(i) && i.doneDay===today())).sort((a,b)=>b.doneAt-a.doneAt);
    if(late.length) html += section("要確認", grouped(late), `${late.length}件`);
    html += now.length ? section("今日やる", grouped(now), `${now.length}件`) : (late.length ? "" : emptyBox("今日やることはまだありません","受信箱の「今日やる」を押すとここに入ります。下の入力欄から追加もできます"));
    const next = filterGenre(open.filter(i=>!i.wait && i.due===tomorrow()));
    if(next.length) html += section("明日やる", grouped(next), `${next.length}件`);
    if(doneToday.length && !S.selecting) html += section("今日終わったこと", doneToday.map(i=>rowTask(i)).join(""), `${doneToday.length}件`);
  } else if(S.view==="inbox"){
    html += list.length ? section(curGenre()||"受信箱", grouped(list), `${list.length}件`) : emptyBox("このジャンルの受信箱は空です","思いついたらまずここへ。「今日やる」か「依頼完了」を押すと振り分けられます");
  } else {
    const l = list;
    const g = {}; l.forEach(i=>{ (g[i.person||"フォルダなし"] ||= []).push(i); });
    const keys = Object.keys(g).filter(k=>k!=="フォルダなし").sort(byName); if(g["フォルダなし"]) keys.push("フォルダなし");
    html += l.length ? keys.map(p=>[p,g[p]]).map(([p,x])=>section(p, x.sort(byTitle).map(i=>rowTask(i)).join(""), `${x.length}件`)).join("") : emptyBox("対応待ちはありません","受信箱で「依頼完了」を押すとここに入り、確認日（3日後）を過ぎると今日やるに浮き上がります");
  }
  return html;
}

function rowTask(i, opts={}){
  if(i.box!=="task") return rowNote(i);
  const meta = [];
  if(i.person && !opts.hidePerson) meta.push(`<span class="person">@${esc(i.person)}</span>`);
  if(i.wait && i.followUp && !isDone(i)){
    const d = daysBetween(today(), i.followUp);
    meta.push(d<0 ? `<span class="bad">確認日を${-d}日超過</span>` : d===0 ? `<span class="bad">今日確認</span>` : `<span>確認 ${fmtDate(i.followUp)}</span>`);
    if((i.chase||0) >= 2) meta.push(`<span class="chase">追いかけ${i.chase-1}回</span>`);
  }
  if(i.due && !isDone(i) && i.due < today()) meta.push(`<span class="bad">納期を${daysBetween(i.due,today())}日超過</span>`);
  if(i.due && !isDone(i) && i.due > tomorrow()) meta.push(`<span>納期 ${fmtDate(i.due)}</span>`);
  const pj = i.projectId && S.meta.projects.find(p=>p.id===i.projectId);
  if(pj && !opts.inPj) meta.push(`<span>◇ ${esc(pj.name)}</span>`);
  if(isDone(i) && i.doneAt){ const dd = new Date(i.doneAt); meta.push(`<span>${dd.getMonth()+1}/${dd.getDate()} 完了</span>`); }
  const late = !isDone(i) && ((i.due && i.due < today()) || followLate(i));
  // 受信箱の項目：「今日やる」「依頼完了」の2ボタン／今日やる：押すと受信箱へ戻る／対応待ち：押すと受信箱へ戻る
  // 受信箱：「今日やる（22時以降は明日やる）」「依頼完了」／今日やる：「明日やる」「受信箱」／
  // 明日やる：「明日」を押すと受信箱へ／対応待ち：確認日が来たら「依頼完了」でもう一度追いかける
  let dueBtn = "";
  if(!isDone(i) && S.selecting){
    const on = S.sel.has(i.id);
    return `<div class="row t ${on?"picked":""}" data-id="${i.id}">
      <button class="selbox" data-act="sel" aria-pressed="${on}" aria-label="選択">${ICON.check}</button>
      <div class="body" data-act="sel"><div class="txt">${esc(i.text)}</div>${meta.length?`<div class="meta">${meta.join("")}</div>`:""}</div>
    </div>`;
  }
  if(!isDone(i)){
    const t = today(), off = i.projectId ? "未定" : "受信箱";
    if(i.wait) dueBtn = followLate(i)
      ? `<div class="btns"><button class="due" data-act="rereq" aria-label="もう一度追いかけて、3日後にまた確認する">依頼完了</button><button class="due wait" data-act="unwait" aria-label="対応待ちを解除して受信箱へ戻す">待ち</button></div>`
      : `<button class="due wait" data-act="unwait" aria-label="対応待ちを解除して受信箱へ戻す">待ち</button>`;
    else if(i.due && i.due <= t) dueBtn = `<div class="btns"><button class="due" data-act="totomorrow">明日やる</button><button class="due" data-act="toinbox">${off}</button></div>`;
    else if(i.due===tomorrow()) dueBtn = `<button class="due on" data-act="toinbox" aria-label="明日やるを解除して${off}に戻す">明日</button>`;
    else dueBtn = `<div class="btns"><button class="due" data-act="totoday">${pickWord()}やる</button><button class="due" data-act="req">依頼完了</button></div>`;
  }
  return `<div class="row t ${isDone(i)?"done":""} ${late?"overdue":""}" data-id="${i.id}">
    <button class="check" data-act="done" aria-label="${isDone(i)?"未完了に戻す":"完了にする"}">${ICON.check}</button>
    <div class="body" data-act="edit"><div class="txt">${esc(i.text)}</div>${meta.length?`<div class="meta">${meta.join("")}</div>`:""}</div>
    ${opts.inPj && !isDone(i) ? `<div class="order"><button class="mini" data-act="up" aria-label="上へ">${ICON.up}</button><button class="mini" data-act="down" aria-label="下へ">${ICON.down}</button></div>` : ""}
    ${dueBtn}
    ${opts.multi ? `<button class="mini" data-act="unmulti" aria-label="マルチタスクから外す" title="マルチタスクから外す">✕</button>` : ""}
  </div>`;
}

function renderDone(){
  const done = ofBox("task").filter(isDone);
  const t = today(), w = startOfWeek(), mo = t.slice(0,7);
  const day = i => i.doneDay || ymd(new Date(i.doneAt||i.updatedAt));
  const cT = done.filter(i=>day(i)===t).length, cW = done.filter(i=>day(i)>=w).length, cM = done.filter(i=>day(i).startsWith(mo)).length;
  const days = [...Array(14)].map((_,k)=>addDays(null,k-13));
  const per = days.map(d=>done.filter(i=>day(i)===d).length);
  const max = Math.max(1,...per);
  let html = `<div class="stats">
    <div class="stat"><div class="k">今日</div><div class="v">${cT}</div><div class="s">件完了</div></div>
    <div class="stat"><div class="k">今週</div><div class="v">${cW}</div><div class="s">月曜から</div></div>
    <div class="stat"><div class="k">今月</div><div class="v">${cM}</div><div class="s">${Number(mo.slice(5))}月</div></div>
  </div>
  <div class="section"><div class="sh"><h3>直近14日</h3><span>最多 ${Math.max(...per)}件/日</span></div>
    <div class="bars" role="img" aria-label="直近14日の完了数">${per.map((n,k)=>`<i class="${n?"":"zero"}" style="height:${Math.max(4,n/max*100)}%" title="${fmtShort(days[k])} ${n}件"></i>`).join("")}</div>
    <div class="barlab">${days.map((d,k)=>`<span>${k%2?"":Number(d.slice(8))}</span>`).join("")}</div></div>`;
  const list = done.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const g = {};
  list.forEach(i=>{ const d = day(i); const k = d===t?"今日":d>=w?"今週":d.startsWith(mo)?"今月":`${Number(d.slice(5,7))}月`; (g[k] ||= []).push(i); });
  const secs = Object.entries(g).map(([k,l])=>section(k, l.map(i=>rowTask(i)).join(""), `${l.length}件`)).join("");
  return html + (secs || emptyBox("まだ完了した項目はありません","チェックを付けるとここに積み上がります"));
}

// マルチタスク：今同時に動いているもの（プロジェクト・フォルダ・単品のタスク）を並べる場所
function multiEntries(){
  return (S.meta.multi||[]).filter(e => e.kind==="folder" ? !!e.name : (()=>{ const i = S.items.get(e.id); return i && i.box==="task" && !isDone(i); })());
}
function renderProjects(){
  const M = multiEntries();
  if(!M.length) return emptyBox("同時に動いているものはまだありません","下の入力欄で「タスク／フォルダ／プロジェクト」を選んで追加すると、ここに並びます");
  const folders = M.filter(e=>e.kind==="folder"), tasks = M.filter(e=>e.kind==="task").map(e=>S.items.get(e.id));
  const card = e => {
    const n = e.name, proj = isProjFolder(n), open = openTasks().filter(i=>i.person===n).length;
    const fp = folderProgress(n);
    return `<div class="pj" data-mfolder="${esc(n)}" role="button" tabindex="0">
      <div class="top"><span class="name"><span class="kind">${proj?"プロジェクト":"フォルダ"}</span>${esc(n)} <small>${proj ? (fp.n ? `${fp.d}/${fp.n} 完了` : "タスクなし") : `未完了 ${open}件`}</small></span>
        ${proj ? `<span class="pct">${fp.pct}<small>%</small></span>` : ""}<button class="mini" data-unmf="${esc(n)}" aria-label="${esc(n)}をマルチタスクから外す" title="マルチタスクから外す">✕</button></div>

    + (tasks.length ? section("タスク", tasks.map(i=>rowTask(i,{multi:true})).join(""), `${tasks.length}件`) : "");
}

function renderNote(){
  const box = S.box;
  // 検索中はジャンルをまたいで探す
  let list = S.search ? ofBox(box) : filterGenre(ofBox(box));
  if(S.search){ const q = S.search.toLowerCase(); list = list.filter(i=>(i.text+" "+i.note+" "+i.url+" "+i.genre).toLowerCase().includes(q)); }
  if(box==="stock") list.sort(byTitle);
  else if(box==="vision" && S.meta.titleSort.vision.includes(curGenre())) list.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || byTitle(a,b));
  else list.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || b.createdAt-a.createdAt);
  let html = genreChips(box, null, true);
  if(box!=="log") html += `<input class="search" id="search" type="search" placeholder="${box==="stock"?"キーワードで引き出す":"検索"}" value="${esc(S.search)}" aria-label="検索">`;
  if(!list.length) return html + emptyBox(S.search?"見つかりませんでした":`${BOXES[box].name} はまだ空です`, S.search?"別のキーワードで試してください":({log:"学びや疑問を1行で。書くこと自体が目的なので、整える必要はありません",stock:"アイデア・行きたい店・ノウハウ・事例リンクを入れておき、必要なときに検索で引き出します",vision:"理想の家やオフィス、方針・決意。ピン留めすると常に上に表示されます"})[box]);
  if(box==="log"){
    const g = {}; list.forEach(i=>{ (g[ymd(new Date(i.createdAt))] ||= []).push(i); });
    html += Object.entries(g).map(([d,l])=>section(d===today()?"今日":fmtDate(d), l.map(rowNote).join(""), `${l.length}件`)).join("");
  } else if(box==="vision"){
    const pin = list.filter(i=>i.pinned), rest = list.filter(i=>!i.pinned);
    if(pin.length) html += section("ピン留め", pin.map(rowNote).join(""), `${pin.length}件`);
    if(rest.length) html += section("ストック", rest.map(rowNote).join(""), `${rest.length}件`);
  } else html += section(S.search ? "検索結果（全ジャンル）" : genreLabel(curGenre()) || "すべて", list.map(rowNote).join(""), `${list.length}件`);
  return html;
}
function rowNote(i){
  const meta = [];
  if(i.genre) meta.push(`<span class="tag">${esc(i.genre)}</span>`);
  if(i.url) meta.push(`<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.url.replace(/^https?:\/\//,""))}</a>`);
  if(i.note) meta.push(`<span>メモあり</span>`);
  if(i.box!=="log"){ const d = new Date(i.createdAt); meta.push(`<span>${d.getMonth()+1}/${d.getDate()}</span>`); }
  return `<div class="row" data-id="${i.id}"><i class="dot"></i>
    <div class="body" data-act="${i.box==="vision"?"view":"edit"}"><div class="txt">${esc(i.text)}</div>${meta.length?`<div class="meta">${meta.join("")}</div>`:""}</div>
    ${i.box==="vision"?`<button class="mini" data-act="pin" aria-pressed="${!!i.pinned}" aria-label="ピン留め">${ICON.pin}</button>`:""}
  </div>`;
}

// ---------- sheets ----------
let sheetRedraw = null;
function openSheet(html, onMount, redraw){
  const o = $("#overlay"); o.hidden = false;
  const prevScroll = o.querySelector(".sheet")?.scrollTop || 0;
  o.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in">${html}</div></div>`;
  o.querySelector("[data-close]").onclick = closeSheet;
  const sh = o.querySelector(".sheet");
  if(redraw) sh.scrollTop = prevScroll;
  sheetRedraw = redraw || null;
  onMount && onMount(sh);
}
function closeSheet(){ const o = $("#overlay"); o.hidden = true; o.innerHTML = ""; sheetRedraw = null; }
function refreshSheet(){ if(sheetRedraw) sheetRedraw(); }
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$("#overlay").hidden) closeSheet(); });

// 連携タスク一覧
// フォルダ（相手）の名前を一括変更。既にある名前にすると1つのフォルダにまとまる
function renameFolder(oldN, newN){
  newN = newN.trim(); if(!newN || newN===oldN) return false;
  const merged = persons().includes(newN);
  ofBox("task").filter(i=>i.person===oldN).forEach(i=>persistItem({...i, person:newN, updatedAt:Date.now()}));
  // フォルダ／プロジェクトのモードを新しい名前に引き継ぐ（まとめた場合はまとめ先のモード）
  const fm = S.meta.folderModes; if(fm[oldN]!==undefined){ if(!merged) fm[newN] = fm[oldN]; delete fm[oldN]; }
  const M = S.meta.multi; M.forEach(e => { if(e.kind==="folder" && e.name===oldN) e.name = newN; });
  S.meta.multi = M.filter((e,k) => e.kind!=="folder" || M.findIndex(x=>x.kind==="folder" && x.name===e.name)===k);
  persistMeta();
  toast(merged ? `「${newN}」にまとめました` : `「${oldN}」を「${newN}」に変更しました`);
  return true;
}
function folderGenre(person, opened){
  // 今開いているジャンルに追加する。ジャンルを絞っていない画面なら、そのフォルダで一番多いジャンル
  if(opened && opened!=="__none") return opened;
  const c = {}; ofBox("task").filter(i=>i.person===person).forEach(i=>{ c[i.genre]=(c[i.genre]||0)+1; });
  return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0] || taskDef();
}
function personSheet(person, openedGenre){
  if(openedGenre===undefined) openedGenre = curGenre();
  let renaming = false, delArm = false, delT;
  const draw = () => {
    const genre = folderGenre(person, openedGenre);
    const list = openTasks().filter(i=>i.person===person);
    const done = ofBox("task").filter(i=>isDone(i) && i.person===person).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,10);
    const tdy = list.filter(i=>isToday(i) || followLate(i)).sort(byTitle);
    const wait = list.filter(i=>i.wait && !tdy.includes(i)).sort(byTitle);
    const rest = list.filter(i=>!tdy.includes(i) && !wait.includes(i)).sort(byTitle);
    const sec = (t,l) => l.length ? section(t, l.map(i=>rowTask(i,{hidePerson:true})).join(""), `${l.length}件`) : "";
    openSheet(`${renaming
        ? `<form class="inlineform" id="rnForm"><input id="rnName" value="${esc(person)}" aria-label="フォルダ名"><button class="btn" type="submit">変更</button></form><p class="note">このフォルダの全タスク（完了分も含む）の名前がまとめて変わります。既にあるフォルダ名にすると、1つにまとまります。</p>`
        : `<div class="fhead"><h2>${esc(person)}</h2>
            <div class="modeseg" role="group" aria-label="表示モード"><button data-fmode="folder" aria-pressed="${!isProjFolder(person)}">フォルダ</button><button data-fmode="project" aria-pressed="${isProjFolder(person)}">プロジェクト</button></div>
            <button class="btn ghost" data-rn style="padding:6px 12px;font-size:13px">名前を変更</button></div>
          ${isProjFolder(person) ? (fp => `<div class="fprog"><div class="prog thick"><i style="width:${fp.pct}%"></i></div><div class="pm"><span>${fp.d}/${fp.n} 完了</span><span>${fp.pct}%</span></div></div>`)(folderProgress(person)) : ""}`}
      <p class="note" style="margin-top:-6px">ジャンル：${esc(genre)}</p>
      ${sec("今日やる・要確認", tdy)}${sec("対応待ち", wait)}${sec("受信箱", rest)}
      ${list.length ? "" : `<p class="note">未完了のタスクはありません。</p>`}
      <form class="inlineform" id="psForm"><input id="psText" placeholder="「${esc(person)}」にタスクを追加" aria-label="タスクを追加"><button class="btn" type="submit">追加</button></form>
      ${done.length ? sec("最近完了", done) : ""}
      <div class="sheetacts"><button class="btn ghost" data-pickin>タスクを選ぶ</button><button class="btn ghost" data-multi>${inMulti(person) ? "マルチタスクから外す" : "マルチタスクに並べる"}</button><button class="btn danger ${delArm?"armed":""}" data-fdel>${delArm ? "もう一度押すと削除" : "削除"}</button><button class="btn ghost" data-close2>閉じる</button></div>`, sh => {
      sh.querySelector("[data-close2]").onclick = closeSheet;
      // 削除：フォルダ（プロジェクト）をなくす。中のタスクは消さず、フォルダなしで元の場所に残す
      sh.querySelector("[data-fdel]").onclick = () => {
        if(!delArm){ delArm = true; draw(); clearTimeout(delT); delT = setTimeout(()=>{ delArm = false; if(sheetRedraw===draw) draw(); }, 4000); return; }
        clearTimeout(delT);
        const inside = ofBox("task").filter(i=>i.person===person).map(i=>({...i}));
        const mode = S.meta.folderModes[person], M = S.meta.multi, k = M.findIndex(e=>e.kind==="folder" && e.name===person), entry = k>=0 ? M[k] : null;
        inside.forEach(i=>persistItem({...i, person:"", updatedAt:Date.now()}));
        delete S.meta.folderModes[person]; if(k>=0) M.splice(k,1); persistMeta();
        closeSheet(); rerender();
        toast(`「${person}」を削除しました（中のタスク${inside.length}件は残しています）`, () => {
          inside.forEach(i=>persistItem(i)); if(mode) S.meta.folderModes[person] = mode; if(entry) S.meta.multi.splice(Math.min(k, S.meta.multi.length), 0, entry); persistMeta(); rerender();
        });
      };
      sh.querySelector("[data-pickin]").onclick = () => pickSheet(person, () => personSheet(person, openedGenre));
      sh.querySelector("[data-multi]").onclick = () => {
        const M = S.meta.multi, k = M.findIndex(e=>e.kind==="folder" && e.name===person);
        if(k>=0) M.splice(k,1); else M.push({kind:"folder", name:person});
        persistMeta(); render(); draw(); toast(k>=0 ? "マルチタスクから外しました" : "マルチタスクに並べました");
      };
      sh.querySelectorAll("[data-fmode]").forEach(b => b.onclick = () => {
        if(b.dataset.fmode==="project") S.meta.folderModes[person] = "project"; else delete S.meta.folderModes[person];
        persistMeta(); render(); draw();
      });
      const rb = sh.querySelector("[data-rn]"); if(rb) rb.onclick = () => { renaming = true; draw(); setTimeout(()=>{ const x = $("#rnName"); if(x){ x.focus(); x.select(); } },0); };
      const rf = sh.querySelector("#rnForm"); if(rf) rf.onsubmit = e => { e.preventDefault(); const v = sh.querySelector("#rnName").value.trim();
        renaming = false; if(renameFolder(person, v)){ person = v; render(); } draw(); };
      sh.querySelector("#psForm").onsubmit = e => { e.preventDefault(); const v = sh.querySelector("#psText").value.trim(); if(!v) return;
        persistItem(newItem(v, {box:"task", person, genre, due: S.view==="today" ? today() : ""})); rerender(); setTimeout(()=>$("#psText")?.focus(),0); };
      sh.addEventListener("click", e => { if(e.target.closest("[data-rn],[data-fmode],[data-pickin],[data-multi],[data-fdel]")) return; rowAction(e, () => personSheet(person, openedGenre)); });
    }, draw);
  };
  draw();
}

function editSheet(id, back){
  const it0 = S.items.get(id); if(!it0) return;
  const it = {...it0};
  const draw = () => {
    const isT = it.box==="task";
    const gs = S.meta.genres[it.box];
    const dueMode = !it.due ? "none" : it.due===today() ? "today" : "date";
    openSheet(`
      <h2>編集</h2>
      <div class="field"><label for="e_text">タイトル</label><textarea id="e_text" style="min-height:56px">${esc(it.text)}</textarea></div>
      ${isT?`
      <div class="grid2">
        <div class="field"><label for="e_person">フォルダ</label><input id="e_person" value="${esc(it.person)}" placeholder="任意" list="persons"></div>
        <div class="field"><label for="e_genre">ジャンル</label><select id="e_genre">${gs.map(g=>`<option ${it.genre===g?"selected":""}>${esc(g)}</option>`).join("")}${it.genre&&!gs.includes(it.genre)?`<option selected>${esc(it.genre)}</option>`:""}</select></div>
      </div>
      <div class="field"><span class="lab">納期</span><div class="seg">
        <button data-setdue="today" aria-pressed="${dueMode==="today"}">今日</button>
        <button data-setdue="none" aria-pressed="${dueMode==="none"}">未定</button>
        <input type="date" id="e_due" value="${dueMode==="date"?esc(it.due):""}" aria-label="日付を指定">
      </div></div>
      `:`
      <div class="field"><label for="e_genre">ジャンル</label><select id="e_genre"><option value="">なし</option>${gs.map(g=>`<option ${it.genre===g?"selected":""}>${esc(g)}</option>`).join("")}${it.genre&&!gs.includes(it.genre)?`<option selected>${esc(it.genre)}</option>`:""}</select></div>
      <div class="field"><label for="e_url">リンク</label><input id="e_url" type="url" value="${esc(it.url)}" placeholder="https://"></div>`}
      <div class="field"><label for="e_note">メモ</label><textarea id="e_note" placeholder="補足・経緯など">${esc(it.note)}</textarea></div>
      ${it.box==="vision"?`<label class="sw"><span>ピン留めして常に上に表示</span><input type="checkbox" id="e_pin" ${it.pinned?"checked":""}></label>`:""}
      <div class="actions"><button class="btn grow" id="e_save">保存</button><button class="btn ghost" data-close2>閉じる</button></div>
      <div class="actions"><button class="btn danger" id="e_del">削除</button></div>
    `, sh => {
      const q = s => sh.querySelector(s);
      const sync = () => {
        it.text = q("#e_text").value.trim();
        it.genre = q("#e_genre").value; it.note = q("#e_note").value;
        if(q("#e_url")) it.url = q("#e_url").value.trim();
        if(q("#e_person")){ it.person = q("#e_person").value.trim(); if(q("#e_due").value) it.due = q("#e_due").value; }
        if(q("#e_pin")) it.pinned = q("#e_pin").checked;
      };
      sh.querySelectorAll("[data-setdue]").forEach(b=>b.onclick=()=>{ sync(); it.due = b.dataset.setdue==="today" ? today() : ""; if(q("#e_due")) q("#e_due").value=""; draw(); });
      const dueIn = q("#e_due"); if(dueIn) dueIn.onchange = () => { sync(); it.due = dueIn.value; draw(); };
      const finish = () => { closeSheet(); render(); if(back) back(); };
      enterKeys(q("#e_text"), () => q("#e_save").click());
      enterKeys(q("#e_note"), () => q("#e_save").click());
      q("#e_save").onclick = () => { sync(); if(!it.text) return; it.updatedAt = Date.now(); persistItem({...it}); finish(); };
      q("[data-close2]").onclick = finish;
      q("#e_del").onclick = () => { const bak = {...it0}; removeItem(id); finish(); toast("削除しました", () => { persistItem(bak); rerender(); }); };
    });
  };
  draw();
}

function renameGenre(box, oldN, newN){
  newN = newN.trim(); const gs = S.meta.genres[box];
  if(!newN || newN===oldN) return false;
  if(gs.includes(newN)){ toast("同じ名前のジャンルがすでにあります"); return false; }
  gs[gs.indexOf(oldN)] = newN;
  if(box==="task" && taskDef()===oldN) S.meta.taskDefault = newN;

// 「@相手」「#ジャンル」だけの行は、それ以降の全項目に適用する指定として扱う
// 「!今日」「!受信箱」「!待ち」「!11/3」（日付＝納期あり）「!納期あり」（明日）も同じく一括指定
const TAG_LINE = /^(?:[@＠#＃!！][^\s　@＠#＃!！]+[\s　]*)+$/;
const VIEW_WORD = {"今日":"today","今日やる":"today","受信箱":"inbox","未定":"inbox","待ち":"wait","対応待ち":"wait","納期あり":"dated"};
function parseViewToken(v){
  v = v.normalize("NFKC");
  if(VIEW_WORD[v]==='dated') return {view:"dated", due:addDays(null,1)};
  if(VIEW_WORD[v]) return {view:VIEW_WORD[v], due:""};
  const m = v.match(/^(\d{1,2})[\/\-.月](\d{1,2})日?$/);
  if(m){
    const now = new Date(); let d = new Date(now.getFullYear(), +m[1]-1, +m[2]);
    if(ymd(d) < today()) d = new Date(now.getFullYear()+1, +m[1]-1, +m[2]);
    const s = ymd(d); return {view: s===today() ? "today" : "dated", due:s};
  }
  return null;
}
function parseImport(text, box){
  let person = "", genre = "", view = "", due = ""; const rows = [];
  for(const raw of text.split(/\r?\n/)){
    let l = raw.trim();
    if(!l || /^[_＿\-ー─=]{3,}$/.test(l) || /^[*＊<＜【]/.test(l)) continue;
    if(TAG_LINE.test(l)){
      for(const m of l.matchAll(/([@＠#＃!！])([^\s　@＠#＃!！]+)/g)){
        if(m[1]==="@"||m[1]==="＠") person = m[2];
        else if(m[1]==="#"||m[1]==="＃") genre = m[2];
        else { const p = parseViewToken(m[2]); if(p){ view = p.view; due = p.due; } }
      }
      continue;
    }
    l = l.replace(/^(?:[・\-–—•◦○●⬛⬜🟦◼◻■□]|︎|️|\s|　)+/u,"").replace(/^[ー─]\s*/,"").trim();
    if(!l) continue;
    rows.push({text:l, person: box==="task" ? person : "", genre, view: box==="task" ? (view||"inbox") : "", due: box==="task" ? due : ""});
  }
  return rows;
}

    <div class="field"><label for="imp">貼り付け</label><textarea id="imp" style="min-height:200px" placeholder="${box==="task"?"@小島 #報酬 !今日&#10;・維持率/昇格率&#10;・外部給与明細&#10;!待ち&#10;・HR 切らせるスクリプト":"#ノウハウ&#10;・〇〇&#10;・〇〇"}"></textarea></div>

let toastTimer;
function toast(msg, undo){
  const h = $("#toastHost"); clearTimeout(toastTimer);
  h.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo?'<button id="undo">元に戻す</button>':""}</div>`;
  if(undo) $("#undo").onclick = () => { undo(); h.innerHTML = ""; };
  toastTimer = setTimeout(()=>{ h.innerHTML=""; }, 4000);
}

function rowAction(e, back){
  const grp = e.target.closest("[data-person]"); if(grp){ personSheet(grp.dataset.person); return true; }
  const a = e.target.closest("[data-act]"); if(!a) return false;
  const row = a.closest("[data-id]"); const it = row && S.items.get(row.dataset.id); if(!it) return false;
  const act = a.dataset.act;
  if(act==="done") complete(it);
  else if(act==="due") toggleDue(it);
  else if(act==="totoday") markToday(it);
  else if(act==="req") markRequested(it);
  else if(act==="unwait") unwait(it);
  else if(act==="rereq") reRequest(it);
  else if(act==="unmulti"){ const M = S.meta.multi, k = M.findIndex(e=>e.kind==="task" && e.id===it.id); if(k>=0){ const e = M.splice(k,1)[0]; persistMeta(); rerender(); toast("マルチタスクから外しました（タスクは残っています）", () => { S.meta.multi.splice(k,0,e); persistMeta(); rerender(); }); } }
  else if(act==="totomorrow") markTomorrow(it);
  else if(act==="toinbox") toInbox(it);
  else if(act==="sel"){ if(S.sel.has(it.id)) S.sel.delete(it.id); else S.sel.add(it.id); render(); }
  else if(act==="edit") editSheet(it.id, back);
  else if(act==="view") viewSheet(it.id);
  else if(act==="pin"){ persistItem({...it, pinned:!it.pinned, updatedAt:Date.now()}); rerender(); }
  else if(act==="up"||act==="down"){
    const sib = openTasks().filter(i=>i.projectId===it.projectId).sort((a,b)=>a.order-b.order);
    const k = sib.findIndex(i=>i.id===it.id), j = k + (act==="up"?-1:1);
    if(j<0||j>=sib.length) return true;
    const o1 = sib[k].order, o2 = sib[j].order;
    persistItem({...sib[k], order:o2===o1?o1+(act==="up"?-1:1):o2}); persistItem({...sib[j], order:o1});
    rerender();
  }
  return true;
}

// ---------- 準備モード（PC専用）：カレンダー3日分＋アラーム ----------
// 表示する3日間：22時より前は「今日〜明後日」、22時以降は「明日〜明々後日」
const CAL_H0 = 9, CAL_H1 = 24, CAL_SPAN = (CAL_H1-CAL_H0)*60;
const PREP_MIN_W = 1000;
const REL = ["今日","明日","明後日","明々後日"];
const P = {open:false, events:[], status:"loading", timer:null};
function prepDays(){ const start = addDays(null, new Date().getHours()>=22 ? 1 : 0); return [0,1,2].map(k=>addDays(start,k)); }
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const minus = (d, m) => hm(new Date(d.getTime() - m*60000));

// 予定の読み込み：Googleカレンダー（接続したアカウントのメインのカレンダー）
// 戻り値は {title, start:Date, end:Date, allDay:boolean, day:"YYYY-MM-DD"} の配列
const GCAL = "Google Calendar";
// Googleカレンダーの予定の色（colorId → 色）。色を指定していない予定はカレンダーの既定色（ピーコック）
const GCOLORS = {"1":"#7986CB","2":"#33B679","3":"#8E24AA","4":"#E67C73","5":"#F6BF26","6":"#F4511E","7":"#039BE5","8":"#616161","9":"#3F51B5","10":"#0B8043","11":"#D50000"};
const GDEFAULT = "#039BE5";
function textOn(hex){
  const n = parseInt(hex.slice(1),16), r = n>>16&255, g = n>>8&255, b = n&255;
  return (0.299*r + 0.587*g + 0.114*b) > 186 ? "#1f1f1f" : "#ffffff";
}
let mcpP = null;
const getMcp = () => mcpP ||= (window.claude?.use ? window.claude.use("mcp").catch(()=>null) : Promise.resolve(null));
async function loadEvents(days, fresh){
  const m = await getMcp();
  if(!m){ const e = new Error("no mcp"); e.code = "not_granted"; throw e; }
  const startTime = days[0]+"T00:00:00", endTime = addDays(days[2],1)+"T00:00:00";
  const raw = []; let pageToken = "", n = 0;
  do{
    const input = {startTime, endTime, orderBy:"startTime", pageSize:250};
    if(pageToken) input.pageToken = pageToken;
    const r = await m.callTool(GCAL, "list_events", input, {cache:{staleTime:60000, gcTime:600000, refresh:!!fresh}});
    const p = (r && r.payload) || {};
    (Array.isArray(p.events) ? p.events : []).forEach(e=>raw.push(e));
    pageToken = p.nextPageToken || ""; n++;
  }while(pageToken && n < 4);
  const out = [];
  raw.forEach(e => {
    if(!e || e.status==="cancelled") return;
    if((e.attendees||[]).some(a=>a.self && a.responseStatus==="declined")) return;
    const title = e.summary || "（タイトルなし）", color = GCOLORS[e.colorId] || GDEFAULT;
    if(e.start?.date){
      // 終日予定は終了日の前日まで各日に表示
      let d = e.start.date; const last = e.end?.date ? addDays(e.end.date,-1) : d;
      for(let k=0; d<=last && k<14; k++, d=addDays(d,1)) if(days.includes(d)) out.push({title, color, allDay:true, day:d, start:new Date(d+"T00:00:00"), end:new Date(d+"T23:59:00")});
    } else if(e.start?.dateTime){
      const st = new Date(e.start.dateTime), en = new Date(e.end?.dateTime || e.start.dateTime);
      if(isNaN(st)) return;
      out.push({title, color, allDay:false, day:ymd(st), start:st, end:isNaN(en)?st:en});
    }
  });
  return out;
}

function layoutDay(list){
  // 重なっている予定は横に並べる
  const s = [...list].sort((a,b)=>a.start-b.start || b.end-a.end);
  let cluster = [], lanes = [], clusterEnd = 0;
  const flush = () => { const n = lanes.length; cluster.forEach(e=>e._n = n); cluster = []; lanes = []; };
  s.forEach(e => {
    if(cluster.length && e.start >= clusterEnd) flush();
    let k = lanes.findIndex(t => t <= e.start); if(k<0){ k = lanes.length; lanes.push(0); }
    lanes[k] = e.end; e._lane = k; cluster.push(e); clusterEnd = Math.max(clusterEnd, +e.end);
  });
  flush(); return s;
}
function renderCal(){
  const days = prepDays(), t = today();
  $("#prepRange").textContent = `${fmtDate(days[0])} – ${fmtDate(days[2])}`;
  const rel = d => { const n = daysBetween(t, d); return REL[n] || ""; };
  let h = `<div class="cal-corner"></div>` + days.map(d=>`<div class="cal-dh"><b>${Number(d.slice(8))}</b><span>${Number(d.slice(5,7))}月 ${WD[new Date(d+"T00:00:00").getDay()]}曜</span><em>${rel(d)}</em></div>`).join("");
  h += `<div class="cal-adl">終日</div>` + days.map(d=>`<div class="cal-ad">${P.events.filter(e=>e.allDay && e.day===d).map(e=>`<i title="${esc(e.title)}" style="--c:${e.color};--fg:${textOn(e.color)}">${esc(e.title)}</i>`).join("")}</div>`).join("");
  h += `<div class="cal-axis">${[...Array(CAL_H1-CAL_H0+1)].map((_,k)=>k && k<CAL_H1-CAL_H0 ? `<span style="top:${k/(CAL_H1-CAL_H0)*100}%">${CAL_H0+k}:00</span>` : "").join("")}</div>`;
  const now = new Date(), nowMin = now.getHours()*60 + now.getMinutes() - CAL_H0*60;
  h += days.map(d => {
    const list = layoutDay(P.events.filter(e=>!e.allDay && e.day===d));
    const evs = list.map((e, idx) => {
      const sm = Math.max(0, e.start.getHours()*60 + e.start.getMinutes() - CAL_H0*60);
      const endD = ymd(e.end)===d ? e.end.getHours()*60 + e.end.getMinutes() : 24*60;
      const em = Math.min(CAL_SPAN, endD - CAL_H0*60);
      if(em <= 0 || sm >= CAL_SPAN) return "";
      const top = sm/CAL_SPAN*100, ht = Math.max(1.8, (em-sm)/CAL_SPAN*100);
      const w = 100/e._n, left = e._lane*w;
      const short = (em-sm) <= 45, past = e.end < now;
      return `<div class="ev ${short?"short":""} ${past?"past":""}" tabindex="0" title="${esc(e.title)}　${hm(e.start)}–${hm(e.end)}" style="top:calc(${top}% + 1px);height:calc(${ht}% - 2px);left:calc(${left}% + 2px);width:calc(${w}% - 6px);--c:${e.color};--fg:${textOn(e.color)}">
        <div class="eb"><span class="et">${esc(e.title)}</span><span class="tm">${hm(e.start)}–${hm(e.end)}</span></div>
        <span class="ab"><button type="button" data-alarm="${minus(e.start,5)}">5分前</button><button type="button" data-alarm="${minus(e.start,15)}">15分前</button></span></div>`;
    }).join("");
    const nl = d===t && nowMin>=0 && nowMin<=CAL_SPAN ? `<div class="nowline" style="top:${nowMin/CAL_SPAN*100}%"></div>` : "";
    return `<div class="cal-col ${d===t?"today":""}">${evs}${nl}</div>`;
  }).join("");
  const MSG = {
    loading:"<b>予定を読み込み中…</b>",
    reauth:"<b>Googleカレンダーの接続が切れています</b>claude.ai の設定 → コネクタから接続し直してください",
    notconn:"<b>Googleカレンダーが接続されていません</b>claude.ai の設定 → コネクタから追加してください",
    denied:`<b>予定の読み込みが許可されていません</b>このページにGoogleカレンダーの読み取りを許可すると表示されます<br><button class="btn" data-calretry>許可して読み込む</button>`,
    noview:"<b>アプリ版ではまだ予定を表示できません</b>Googleカレンダーの読み込みはClaude上のTSLVだけの機能です。アラームはこのまま使えます",
    error:`<b>予定を読み込めませんでした</b><button class="btn ghost" data-calretry>もう一度読み込む</button>`
  };
  if(P.status!=="ok" && MSG[P.status]) h += `<div class="cal-msg"><div>${MSG[P.status]}</div></div>`;
  $("#cal").innerHTML = h;
}
let calSeq = 0;
async function refreshCal(fresh, retried){
  const seq = ++calSeq, days = prepDays();
  if(!P.events.length || P.status!=="ok"){ P.status = "loading"; if(P.open) renderCal(); }
  try{
    const evs = await loadEvents(days, fresh);
    if(seq!==calSeq) return;
    P.events = evs; P.status = "ok";
  }catch(e){
    if(seq!==calSeq) return;
    const c = e && e.code;
    if(e && e.retryable && !retried){ setTimeout(()=>refreshCal(fresh, true), (e.retryAfterMs || 1500) + Math.random()*1000); return; }
    P.status = c==="needs_reauth" ? "reauth"
      : (c==="server_not_connected" || c==="server_not_found" || c==="selection_required") ? "notconn"
      : (c==="not_in_manifest" || c==="approval_required" || c==="blocked_by_policy") ? "denied"
      : (c==="not_granted" || c==="capability_disabled" || c==="capability_removed") ? "noview"
      : "error";
    if(P.status!=="error") P.events = [];
  }
  if(P.open) renderCal();
}

// アラーム：「10:00、15:30、16:50」→ 10:00,15:30,16:50 にしてコピー（iPhoneのショートカットが読む）
const ALARM_KEY = "tlsv.alarm";
function parseAlarms(text){
  const parts = String(text).normalize("NFKC").split(/[、,，\s]+/).filter(Boolean);
  const seen = new Set(), out = [];
  parts.forEach(p => {
    const m = p.match(/^(\d{1,2}):?(\d{2})$/); let v = p, ok = false;
    if(m && +m[1] < 24 && +m[2] < 60){ ok = true; v = `${pad(+m[1])}:${m[2]}`; }
    if(seen.has(v)) return; seen.add(v); out.push({v, ok});
  });
  return out.sort((a,b)=> a.ok && b.ok ? a.v.localeCompare(b.v) : a.ok ? -1 : b.ok ? 1 : 0);
}
function setAlarmText(v){ $("#alarmIn").value = v; try{ localStorage.setItem(ALARM_KEY, v); }catch(e){} renderAlarm(); }
function renderAlarm(){
  const list = parseAlarms($("#alarmIn").value);
  $("#achips").innerHTML = list.length ? list.map(a=>`<span class="achip ${a.ok?"":"bad"}">${esc(a.ok ? a.v : a.v+"？")}<button type="button" data-rm-alarm="${esc(a.v)}" aria-label="${esc(a.v)}を外す">×</button></span>`).join("") : `<span class="note">時刻を入力するか、予定の「5分前」「15分前」を押してください</span>`;
  const out = list.filter(a=>a.ok).map(a=>a.v).join(",");
  $("#aout").textContent = out ? `コピーされる内容：${out}` : "";
  return out;
}
function addAlarm(v){
  const cur = parseAlarms($("#alarmIn").value).map(a=>a.v);
  if(cur.includes(v)){ toast(`${v} はすでに入っています`); return; }
  setAlarmText([...cur, v].join("、")); toast(`${v} を追加しました`);
}
try{ $("#alarmIn").value = localStorage.getItem(ALARM_KEY) || ""; }catch(e){}
$("#alarmIn").addEventListener("input", () => { try{ localStorage.setItem(ALARM_KEY, $("#alarmIn").value); }catch(e){} renderAlarm(); });
$("#achips").addEventListener("click", e => { const b = e.target.closest("[data-rm-alarm]"); if(!b) return; setAlarmText(parseAlarms($("#alarmIn").value).map(a=>a.v).filter(v=>v!==b.dataset.rmAlarm).join("、")); });
$("#alarmClear").onclick = () => setAlarmText("");
$("#alarmCopy").onclick = () => {
  const out = renderAlarm(); if(!out){ toast("時刻を入力してください"); return; }
  const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#aout")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("自動でコピーできなかったので選択しました。そのままコピーしてください"); };
  try{ navigator.clipboard.writeText(out).then(() => toast(`コピーしました：${out}`), fallback); }catch(e){ fallback(); }
};
$("#cal").addEventListener("click", e => {
  if(e.target.closest("[data-calretry]")){ refreshCal(true); return; }
  const b = e.target.closest("[data-alarm]"); if(b) addAlarm(b.dataset.alarm);
});
$("#prepReload").onclick = () => refreshCal(true);
// 22時をまたいだら「今日やる／明日やる」の表示を切り替える
let lastNight = isNight();
setInterval(() => { if(isNight()!==lastNight){ lastNight = isNight(); render(); } }, 60000);

function setPrep(open){
  if(open && innerWidth < PREP_MIN_W){ toast("準備は横長の画面で使えます"); return; }
  P.open = open; document.body.classList.toggle("prep", open);
  $("#btnPrep").setAttribute("aria-pressed", String(open));
  clearInterval(P.timer);
  if(open){
    renderCal(); renderAlarm(); refreshCal();
    // 1分ごとに現在時刻の線と、22時の表示切り替えを更新
    P.timer = setInterval(() => { const k = prepDays()[0]; if(k!==P.lastStart){ P.lastStart = k; refreshCal(); } else renderCal(); }, 60000);
    P.lastStart = prepDays()[0];
  }
}
$("#btnPrep").onclick = () => setPrep(!P.open);
$("#prepClose").onclick = () => setPrep(false);
addEventListener("resize", () => { if(P.open && innerWidth < PREP_MIN_W) setPrep(false); });

initStore();
})();
</script>
